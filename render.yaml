# Render Blueprint — https://render.com/docs/blueprint-spec
#
# ใช้ตอนสมัคร Render ครั้งแรก: New > Blueprint > เลือก repo นี้
# Render จะอ่านไฟล์นี้แล้วตั้งค่า service ให้อัตโนมัติ เหลือแค่กรอกค่า
# OPENROUTER_API_KEY กับ SOCIALSCOOP_PASSWORD เอง (ตั้ง sync: false ไว้ เพราะ
# เป็นความลับ ไม่ควรอยู่ในไฟล์ที่ push ขึ้น git)

services:
  - type: web
    name: socialscoop
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SOCIALSCOOP_PASSWORD
        sync: false
      # เสริมเมื่อ TikTok/Instagram ต้องใช้คุกกี้ (ดู downloader.py: cookie_file()) —
      # ค่านี้ต้องชี้ไปที่ path ของ Secret File ที่อัปโหลดแยกไว้ ไม่ใช่เนื้อหาคุกกี้ตรงๆ
      # อัปโหลดไฟล์ที่ Environment > Secret Files ก่อน (Render จะ mount ให้ที่
      # /etc/secrets/<ชื่อไฟล์>) แล้วค่อยตั้งตัวแปรนี้ให้ชี้ไปที่ path นั้น
      - key: SOCIALSCOOP_COOKIES_FILE
        sync: false
