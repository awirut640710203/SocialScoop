<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SocialScoop — ดาวน์โหลดวิดีโอพร้อมข้อมูลโพสต์</title>
  <link rel="stylesheet" href="/static/fonts.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">ข้ามไปยังเนื้อหาหลัก</a>

  <header class="site-head">
    <div class="wordmark">Social<em>Scoop</em></div>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="สลับธีมสว่างและมืด">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main id="main">
    <section class="hero">
      <h1><span class="nb">ดาวน์โหลดวิดีโอ</span> <span class="nb">พร้อมคำบรรยาย</span></h1>
      <p class="hero-sub">รองรับ TikTok, Instagram และ Threads — ได้ไฟล์<span class="nb">คุณภาพสูงสุด</span>ที่โพสต์นั้นมี พร้อมให้ AI ช่วย<span class="nb">สรุปเนื้อหา</span></p>

      <form id="fetch-form" class="paste-bar" autocomplete="off">
        <label class="visually-hidden" for="url-input">ลิงก์ของโพสต์</label>
        <input
          id="url-input"
          name="url"
          type="url"
          inputmode="url"
          placeholder="วางลิงก์ของโพสต์ที่นี่"
          required
        />
        <button type="submit" class="btn-primary" id="fetch-btn">
          <span class="btn-label">ดึงข้อมูล</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>

      <div class="chip-row" id="chip-row">
        <span class="chip" data-platform="tiktok">TikTok</span>
        <span class="chip" data-platform="instagram">Instagram</span>
        <span class="chip" data-platform="threads">Threads</span>
      </div>

      <p class="form-error" id="form-error" role="alert" hidden></p>
    </section>

    <!-- โครงร่างระหว่างรอ ขนาดเท่าผลลัพธ์จริง เพื่อไม่ให้เนื้อหากระโดดตอนโหลดเสร็จ -->
    <section class="result-wrap" id="skeleton" hidden aria-hidden="true">
      <div class="result-grid">
        <div class="skeleton thumb-skeleton"></div>
        <div>
          <div class="skeleton line" style="width: 60%"></div>
          <div class="skeleton line" style="width: 35%; height: 12px"></div>
          <div class="skeleton block" style="height: 190px"></div>
          <div class="skeleton line" style="width: 80%"></div>
        </div>
      </div>
    </section>

    <section class="result-wrap" id="result" hidden></section>
  </main>

  <footer class="site-foot">
    <p>
      <span class="nb">สำหรับใช้งานส่วนตัวเท่านั้น</span> ·
      <span class="nb">โปรดเคารพลิขสิทธิ์และเงื่อนไขของแต่ละแพลตฟอร์ม</span> ·
      <span class="nb">รองรับเฉพาะโพสต์สาธารณะ</span>
    </p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script>
    window.SOCIALSCOOP = { aiEnabled: {{ 'true' if ai_enabled else 'false' }} };
  </script>
  <script src="/static/app.js"></script>
</body>
</html>
